# Demo app for acme-dev. The chart version is filled from promotion/versions/dev.yaml (see kustomization.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: demo
  namespace: flux-system
spec:
  releaseName: demo
  targetNamespace: demo
  interval: 10m
  chart:
    spec:
      chart: ./apps/demo/chart
      version: 0.0.0  # replaced by the promotion pin
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: demo-values-acme-dev
