# Demo app delivery for acme-prod (Flux path of the apps Kustomization). The inner layer, release/,
# builds the HelmRelease, values ConfigMaps and promotion pins and applies the version replacement;
# this layer then drops everything that is not the HelmRelease or this cluster's values, because
# kustomize runs patches before replacements within one layer.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - release
patches:
  # only this env's pin and values are used; drop the rest
  - target:
      kind: PromotionPin
    patch: |-
      $patch: delete
      apiVersion: fleet.example/v1
      kind: PromotionPin
      metadata:
        name: ignored
  - target:
      kind: ConfigMap
      name: "demo-values-acme-dev|demo-values-globex-dev|demo-values-globex-prod"
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ignored
