# Inner layer for acme-prod: HelmRelease + values ConfigMap + chart version from the prod pin.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - ../../../values
  - ../../../../../promotion
replacements:
  - source:
      kind: PromotionPin
      name: pin-prod
      fieldPath: chart.version
    targets:
      - select:
          kind: HelmRelease
          name: demo
        fieldPaths:
          - spec.chart.spec.version
      - select:
          kind: HelmRelease
          name: demo
        fieldPaths:
          - spec.values.image.tag
        options:
          create: true
