replicas:
  web: 1
  api: 1
  worker: 1

hostname: demo.example.fleet.test

image:
  # "owner" is a placeholder. Offline, make up builds this name locally and kind-loads it into the
  # nodes (no registry pull), so any lowercase name works. For the image release.yml publishes, use
  # ghcr.io/<repository owner, lowercased>/fleet-demo.
  repository: ghcr.io/owner/fleet-demo
  tag: 0.1.0

features:
  newBanner: false

port: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

gateway:
  name: fleet-gateway
  namespace: nginx-gateway

monitoringNamespace: monitoring
