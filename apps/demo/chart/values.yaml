replicas:
  web: 1
  api: 1
  worker: 1

hostname: demo.example.fleet.test

image:
  # Deliberately not pullable (example.invalid). Offline, make up builds this name locally and
  # kind-loads it into the nodes (no registry pull). release.yml rewrites it to
  # ghcr.io/<repository owner, lowercased>/fleet-demo when it packages the chart.
  repository: example.invalid/fleet-demo
  tag: 0.1.0
  # Optional sha256:<64 hex>. When set the pods run <repository>@<digest> and tag is ignored.
  # Empty for the offline flow; release.yml sets the digest of the image it just pushed.
  digest: ""

features:
  newBanner: false

port: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

gateway:
  name: fleet-gateway
  namespace: nginx-gateway

monitoringNamespace: monitoring
