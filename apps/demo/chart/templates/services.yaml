{{- range $component := list "web" "api" }}
{{- $ctx := dict "root" $ "component" $component }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  labels:
    {{- include "demo.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "demo.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
