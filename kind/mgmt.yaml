# Management cluster: Cluster API (CAPD) + Flux. Created by scripts/mgmt-up.sh,
# which passes --image "$KIND_NODE_IMAGE" from versions.env.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fleet-mgmt
nodes:
  - role: control-plane
    extraMounts:
      # CAPD creates workload-cluster containers through the host Docker socket.
      - hostPath: /var/run/docker.sock
        containerPath: /var/run/docker.sock
