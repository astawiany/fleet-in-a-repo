# Workload cluster for customer "globex", environment "dev".
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: globex-dev
  namespace: fleet
  labels:
    fleet/customer: globex
    fleet/environment: dev
    fleet/cni: kindnet
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["192.168.0.0/16"]
    services:
      cidrBlocks: ["10.128.0.0/12"]
    serviceDomain: cluster.local
  topology:
    classRef:
      name: fleet-capd
    # Substituted from versions.env by mgmt-up.sh (Flux postBuild substitution uses the same syntax).
    version: ${WORKLOAD_K8S_VERSION}
    controlPlane:
      replicas: 1
    workers:
      machineDeployments:
        - class: default-worker
          name: md-0
          replicas: 1
