# Promotion pipeline: when the dev (or test) pin changes on main, open a PR that bumps the next
# stage (dev -> test, test -> prod). What gates what:
#   - the promotion PR needs the validate.yml checks and a code-owner review before it can merge
#     (branch protection from scripts/protect-branch.sh);
#   - the job that opens the PR runs in the GitHub Environment "test" or "prod", whose required
#     reviewers (also from protect-branch.sh) must approve before the job starts.
# The PR branch is stable (promote/<env>): reruns force-push it (--force-with-lease) and update the
# open PR instead of opening a second one. Jobs for one target env never run concurrently.
#
# Auth: GITHUB_TOKEN only (no long-lived PAT). Repo setting required: Settings > Actions > General >
# "Allow GitHub Actions to create and approve pull requests", otherwise gh pr create fails.
# Limitation: PRs created with GITHUB_TOKEN do not trigger validate.yml, so the required checks stay
# pending. Close and reopen the PR, or set the repository variable USE_APP_TOKEN=true with secrets
# GITHUB_APP_ID and GITHUB_APP_PRIVATE_KEY of a GitHub App installed on this repo (scripts/app-token.sh
# mints the token with openssl and curl); then the PR is created by the App and checks run.
# See .github/README.md.
name: promote

on:
  push:
    branches: [main]
    paths:
      - promotion/versions/dev.yaml
      - promotion/versions/test.yaml

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dev_changed: ${{ steps.files.outputs.dev_changed }}
      test_changed: ${{ steps.files.outputs.test_changed }}
    steps:
      - uses: actions/checkout@v4.2.2  # tag pin; replace with the commit SHA when online
        with:
          fetch-depth: 0
      - name: Which pins did this push change?
        id: files
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # First push of a branch (all-zero BEFORE) or an unreachable BEFORE (force push): compare
          # against the empty tree, i.e. treat every pin file as changed.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            changed="$(git ls-tree -r --name-only "$GITHUB_SHA")"
          else
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          fi
          for env in dev test; do
            if printf '%s\n' "$changed" | grep -qx "promotion/versions/$env.yaml"; then
              echo "${env}_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "${env}_changed=false" >> "$GITHUB_OUTPUT"
            fi
          done

  promote-test:
    needs: detect
    if: needs.detect.outputs.dev_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Environment "test": required reviewers configured by scripts/protect-branch.sh must approve
    # before this job runs (and so before the promotion PR is opened).
    environment: test
    concurrency:
      group: promote-test
      cancel-in-progress: false
    env:
      FROM: dev
      TO: test
    steps:
      - uses: actions/checkout@v4.2.2  # tag pin; replace with the commit SHA when online
        with:
          fetch-depth: 0
      - name: Install yq
        run: |
          scripts/ci-install-tools.sh yq
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Mint GitHub App token (optional)
        id: app
        if: ${{ vars.USE_APP_TOKEN == 'true' }}
        env:
          APP_ID: ${{ secrets.GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          token="$(scripts/app-token.sh)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Promote dev to test
        id: promote
        run: |
          branch="promote/$TO"
          git fetch origin "$branch" || true
          git checkout -B "$branch" "$GITHUB_SHA"
          out="$(scripts/promote.sh "$FROM" "$TO")"
          echo "$out"
          if [ "$out" = "no change" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=$out" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update promotion PR
        if: steps.promote.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.promote.outputs.summary }}
        run: |
          branch="promote/$TO"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "promotion/versions/$TO.yaml"
          git commit -m "chore(promotion): $SUMMARY"
          git push --force-with-lease origin "$branch"
          body="Automated promotion from $FROM: $SUMMARY. Triggered by $GITHUB_SHA."
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" -gt 0 ]; then
            gh pr edit "$branch" --title "Promote to $TO" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "Promote to $TO" --body "$body"
          fi

  promote-prod:
    needs: detect
    if: needs.detect.outputs.test_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Environment "prod": required reviewers configured by scripts/protect-branch.sh must approve
    # before this job runs (and so before the promotion PR is opened).
    environment: prod
    concurrency:
      group: promote-prod
      cancel-in-progress: false
    env:
      FROM: test
      TO: prod
    steps:
      - uses: actions/checkout@v4.2.2  # tag pin; replace with the commit SHA when online
        with:
          fetch-depth: 0
      - name: Install yq
        run: |
          scripts/ci-install-tools.sh yq
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Mint GitHub App token (optional)
        id: app
        if: ${{ vars.USE_APP_TOKEN == 'true' }}
        env:
          APP_ID: ${{ secrets.GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          token="$(scripts/app-token.sh)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Promote test to prod
        id: promote
        run: |
          branch="promote/$TO"
          git fetch origin "$branch" || true
          git checkout -B "$branch" "$GITHUB_SHA"
          out="$(scripts/promote.sh "$FROM" "$TO")"
          echo "$out"
          if [ "$out" = "no change" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=$out" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update promotion PR
        if: steps.promote.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.promote.outputs.summary }}
        run: |
          branch="promote/$TO"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "promotion/versions/$TO.yaml"
          git commit -m "chore(promotion): $SUMMARY"
          git push --force-with-lease origin "$branch"
          body="Automated promotion from $FROM: $SUMMARY. Triggered by $GITHUB_SHA."
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" -gt 0 ]; then
            gh pr edit "$branch" --title "Promote to $TO" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "Promote to $TO" --body "$body"
          fi
