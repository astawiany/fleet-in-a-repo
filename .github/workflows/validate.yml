# Pull-request gate: lint, manifest validation, bats tests, then a lite kind/CAPD smoke run.
# Job ids (lint, validate, test, smoke) are the required status checks that
# scripts/protect-branch.sh configures; rename them there too. The security job is deliberately
# not required (see OPTIONAL_JOBS in scripts/protect-branch.sh).
#
# Note: PRs opened by promote.yml with GITHUB_TOKEN do not trigger this workflow (GitHub does not
# start workflows from events caused by GITHUB_TOKEN). Close and reopen such a PR (or push an
# empty commit to its branch) to run these checks, or switch promote.yml to a GitHub App token
# (APP_ID / APP_PRIVATE_KEY secrets, see the comments there).
name: validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          scripts/ci-install-tools.sh kustomize kubeconform helm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # pipx: ubuntu-24.04's system Python refuses pip --user installs (PEP 668)
          pipx install yamllint==1.37.1
      - run: make lint

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          scripts/ci-install-tools.sh kustomize kubeconform helm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make validate

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          scripts/ci-install-tools.sh kustomize kubeconform helm yq flux
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y bats
      # test/observability.bats uses promtool from PATH, else docker with the pinned PROMTOOL_IMAGE.
      - run: make test

  # Not a required check: scripts/protect-branch.sh leaves it out of the branch protection contexts,
  # because it downloads the Trivy and Go vulnerability databases at run time and an upstream outage
  # or a newly published CVE must not block unrelated merges. release.yml runs the same gate as a
  # hard stop before anything is published.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          scripts/ci-install-tools.sh cosign trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the demo image and run the security gate
        run: |
          docker build -t fleet-demo:ci apps/demo/src
          scripts/security-scan.sh fleet-demo:ci

  smoke:
    needs: [lint, validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLEET_PROFILE: lite
      FLEET_UP_TIMEOUT: "900"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # full history: mgmt-up.sh pushes HEAD into the offline bare repo served to Flux
          fetch-depth: 0
      - name: Install tools
        run: |
          scripts/ci-install-tools.sh kind clusterctl flux helm kubectl kubeconform kustomize yq
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Raise inotify limits (kind nodes run systemd; the runner default of 128 is too low)
        run: sudo sysctl -w fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288
      - run: make up
      - run: make smoke
      - name: Diagnostics on failure
        if: failure()
        run: scripts/ci-diagnostics.sh
      - run: make down
        if: always()
