# Release: on a chart-v* tag, publish the demo Helm chart and the app image to ghcr.io.
# Auth is GITHUB_TOKEN with packages: write.
name: release

on:
  push:
    tags: ['chart-v*']

permissions:
  contents: read
  packages: write

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2  # tag pin; replace with the commit SHA when online
      - name: Install helm
        run: |
          scripts/ci-install-tools.sh helm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Package and push chart
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          version="${TAG#chart-v}"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          # The repo default is a non-pullable placeholder for the offline flow; publish the real image name.
          OWNER="$owner" VERSION="$version" yq -i \
            '.image.repository = "ghcr.io/" + strenv(OWNER) + "/fleet-demo" | .image.tag = strenv(VERSION)' \
            apps/demo/chart/values.yaml
          helm package apps/demo/chart --version "$version" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/demo-${version}.tgz" "oci://ghcr.io/${owner}/charts"

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4.2.2  # tag pin; replace with the commit SHA when online
      - name: Build and push image, record digest
        id: push
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          # same image name as apps/demo/chart/values.yaml image.repository (owner placeholder aside)
          ref="ghcr.io/${owner}/fleet-demo:${TAG#chart-v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t "$ref" apps/demo/src
          docker push "$ref"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")"
          echo "pushed digest: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Image digest" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$digest\`" >> "$GITHUB_STEP_SUMMARY"
