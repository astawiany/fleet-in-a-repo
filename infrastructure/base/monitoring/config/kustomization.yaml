# Applied by the Flux Kustomization `monitoring-config` (components.yaml), which dependsOn
# `monitoring`: PodMonitor and PrometheusRule need the CRDs the kube-prometheus-stack HelmRelease installs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - flux-podmonitor.yaml
  - slo-rules.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dashboard-platform-health
    files: [platform.json=dashboards/platform.json]
  - name: dashboard-demo-slis
    files: [demo-slis.json=dashboards/demo-slis.json]
