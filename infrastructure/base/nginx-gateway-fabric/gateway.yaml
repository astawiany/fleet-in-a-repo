# Shared entry point of the cluster. The demo chart's HTTPRoute (namespace demo) attaches here.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fleet-gateway
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: demo
