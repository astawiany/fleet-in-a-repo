apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v${CERT_MANAGER_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      keep: true
    resources:
      requests: {cpu: 10m, memory: 48Mi}
      limits: {memory: 192Mi}
    webhook:
      resources:
        requests: {cpu: 10m, memory: 24Mi}
        limits: {memory: 96Mi}
    cainjector:
      resources:
        requests: {cpu: 10m, memory: 48Mi}
        limits: {memory: 192Mi}
    startupapicheck:
      resources:
        requests: {cpu: 10m, memory: 24Mi}
        limits: {memory: 96Mi}
