# MetalLB in L2 mode with the native speaker: no FRR and no frr-k8s (no BGP here). The address
# pool lives in pool/ and is applied by the metallb-pool Kustomization once CRDs and webhook are up.
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  chart:
    spec:
      chart: metallb
      version: "${METALLB_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: metallb
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    frrk8s:
      enabled: false
    controller:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
    speaker:
      frr:
        enabled: false
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
